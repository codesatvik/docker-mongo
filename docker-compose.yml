version: '3.8'
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fullstack-app-fe-docker
    ports:
      - "3001:3000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fullstack-app-docker
    ports:
        - "3000:3000"

  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"

volumes:
  mongodb_data:
